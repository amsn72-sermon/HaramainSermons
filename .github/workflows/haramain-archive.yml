name: Refresh Haramain sermon archive
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .haramain-sync/server/**
      - .haramain-sync/sync.mjs
      - .haramain-sync/youtube-sync.py
      - .github/workflows/haramain-archive.yml
permissions:
  contents: write
concurrency:
  group: haramain-archive
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read official YouTube playlists and scheduled broadcasts
        run: |
          python3 -m pip install --disable-pip-version-check --upgrade yt-dlp
          python3 .haramain-sync/youtube-sync.py
          node .haramain-sync/sync.mjs
      - name: Preserve the archive in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # الملفّان مولَّدان لا يُدمَجان: إذا سبقنا أحدٌ إلى الفرع أُعيد
          #   بناءُ الالتزام فوق أحدثِ حالةٍ له بملفَّينا نحن، فلا يقع
          #   تعارضُ دمجٍ أصلًا. وكان `pull --rebase` يصطدم بتعارضٍ في
          #   الملفَّين في كلِّ محاولةٍ فتفشل الدورةُ والأرشيفُ سليم.
          out="$RUNNER_TEMP/haramain-out"
          mkdir -p "$out"
          cp .haramain-sync/youtube-catalogue.json "$out/youtube-catalogue.json"
          cp archive/feed.json "$out/feed.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            mkdir -p .haramain-sync archive
            cp "$out/youtube-catalogue.json" .haramain-sync/youtube-catalogue.json
            cp "$out/feed.json" archive/feed.json
            git add .haramain-sync/youtube-catalogue.json archive/feed.json
            if git diff --cached --quiet; then
              echo 'الأرشيف كما هو؛ لا جديد يُدفَع'; exit 0
            fi
            git commit -m 'Refresh public sermon archive'
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push race on attempt $attempt; retrying"
            sleep $((attempt * 7))
          done
          echo 'الأرشيف لم يُدفَع بعد خمس محاولات' >&2
          exit 1
