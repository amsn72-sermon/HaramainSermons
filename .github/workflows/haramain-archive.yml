name: Refresh Haramain sermon archive
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .haramain-sync/server/**
      - .haramain-sync/sync.mjs
      - .haramain-sync/youtube-sync.py
      - .github/workflows/haramain-archive.yml
permissions:
  contents: write
concurrency:
  group: haramain-archive
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read official YouTube playlists and scheduled broadcasts
        run: |
          python3 -m pip install --disable-pip-version-check --upgrade yt-dlp
          python3 .haramain-sync/youtube-sync.py
          node .haramain-sync/sync.mjs
      - name: Preserve the archive in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .haramain-sync/youtube-catalogue.json archive/feed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public sermon archive'
          # الدفعُ يُعاد عند تزاحم الدورات: دورةٌ أخرى أو رفعُ ملفٍّ قد
          #   يسبقنا إلى الفرع، فلا تُحسَب الدورةُ فاشلةً لأجل سباق
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push race on attempt $attempt; retrying"
            git rebase --abort || true
            sleep $((attempt * 7))
          done
          echo 'الأرشيف لم يُدفَع بعد خمس محاولات' >&2
          exit 1
